<body>
<div id="root"></div>
<script>
// ============================================================
// ⚙️ 設定：貼上你的 Apps Script 部署網址
// ============================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiH-vSjYQdInKyUc2BcX5ct94b8QMXD8IYZwzLj45sA90-wRS8yS4eFSP-5qV_IEkN/exec';
// 例如: 'https://script.google.com/macros/s/AKfycbzhuj80ozTlDJMka5TEvNCjdvj5fMFepQnckJ8c-wveTD1Wg9-yl83BfVw5w-PXxgC9/exec'
// 留空時會只使用 localStorage（離線模式）

const {useState,useEffect,useRef,useMemo} = React;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowMs = () => Date.now();
const r1 = x => Math.round(x*10)/10;
const np = x => {const v=r1(x);return Number.isInteger(v)?String(v):v.toFixed(1);};
const money = (x,d=2) => Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const clock = t => new Date(t).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
function gaussian(){let u=0,v=0;while(!u) u=Math.random();while(!v) v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

// ===== API Bridge (fetch to Apps Script) =====
async function gs(action, payload) {
  if (!SCRIPT_URL) throw new Error('SCRIPT_URL 尚未設定');
  const body = {action};
  if (action === 'saveData') body.data = payload;
  else if (action === 'submitLeave') body.payload = payload;
  const resp = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  const text = await resp.text();
  try {
    const json = JSON.parse(text);
    if (!json.ok) throw new Error(json.error || 'API error');
    return json.result;
  } catch(e) {
    // Apps Script sometimes returns the raw result
    return text;
  }
}

const HAS_GS = !!SCRIPT_URL;
const LS_CACHE = "ce.cache.v1", LS_MKT = "ce.market.v1";
const lsGet = k => {try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet = (k,v) => {try{localStorage.setItem(k,v);}catch(e){}};

const DEFAULT_SETTINGS = {
  answer:1, workbook:3, help:2, forget:-2,
  items:["紅筆","課本","習作","練習簿","聯絡簿"],
  bands:[{min:90,pts:5},{min:80,pts:3},{min:70,pts:1}],
  tutor:{base:3,threshold:10,perPoint:0.5},
  loanRate:0.01,
  eth:{start:3500,vol:0.014,drift:0.0004,tickMs:3000},
  kiosk:{enabled:false,pin:"",cooldown:8}
};
const newStudent = name => ({id:uid(),name,points:0,eth:0,costBasis:0,loans:[],examTarget:80,history:[]});
const newClass = (name,students=[]) => ({id:uid(),name,students});
function defaultBlob(){
  const jia=newClass("五年甲班"),yi=newClass("五年乙班");
  return {classes:{[jia.id]:jia,[yi.id]:yi},activeId:jia.id,settings:DEFAULT_SETTINGS};
}
function tutorBonus(imp,t){if(imp<=t.threshold) return 0;return r1(t.base+(imp-t.threshold)*t.perPoint);}
function examBonus(actual,target,bands){
  if(actual<target) return {ok:false,pts:0};
  for(const b of bands) if(actual>=b.min) return {ok:true,pts:b.pts};
  return {ok:true,pts:0};
}
function loanOwed(l,rate){const days=(nowMs()-l.start)/86400000;return l.principal*Math.pow(1+rate,days);}
function totalOwed(s,rate){return (s.loans||[]).reduce((a,l)=>a+loanOwed(l,rate),0);}
function netWorth(s,price,rate){return s.points+s.eth*price-totalOwed(s,rate);}
function classNet(c,price,rate){return c.students.reduce((a,s)=>a+netWorth(s,price,rate),0);}

const canon = b => {
  const aid = b.activeId && b.classes[b.activeId] ? b.activeId : Object.keys(b.classes)[0];
  return JSON.stringify({classes:b.classes,activeId:aid,settings:{...DEFAULT_SETTINGS,...(b.settings||{})}});
};

// ===== Modal Component =====
function Modal({title,onClose,foot,children,lg}){
  return React.createElement("div",{className:"overlay",onClick:onClose},
    React.createElement("div",{className:`modal ${lg?"lg":""}`,onClick:e=>e.stopPropagation()},
      React.createElement("div",{className:"mhead"},
        React.createElement("h3",null,title),
        React.createElement("button",{className:"x",onClick:onClose},"×")),
      React.createElement("div",{className:"mbody"},children),
      foot && React.createElement("div",{className:"mfoot"},foot)));
}

// ===== Spark Chart =====
function Spark({data}){
  if(!data||data.length<2) return React.createElement("div",{className:"note",style:{marginTop:10}},"正在累積行情資料…");
  const w=700,h=160,padX=10,padY=10,n=data.length;
  const ohlc=data.map(d=>{const c=d.close!=null?d.close:d.price;const o=d.open!=null?d.open:c;return {o,hi:d.high!=null?d.high:Math.max(o,c),lo:d.low!=null?d.low:Math.min(o,c),c};});
  const vals=ohlc.reduce((a,d)=>a.concat([d.hi,d.lo]),[]);
  const min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;
  const slotW=(w-2*padX)/n,bodyW=Math.max(2,slotW*0.62);
  const y=v=>padY+(h-2*padY)*(1-(v-min)/span);
  return React.createElement("svg",{viewBox:`0 0 ${w} ${h}`,width:"100%",height:h,style:{marginTop:12,display:"block"},preserveAspectRatio:"none"},
    ohlc.map((d,i)=>{
      const cx=padX+slotW*(i+0.5),up=d.c>=d.o,col=up?"#0E9F6E":"#E05555";
      const bT=y(Math.max(d.o,d.c)),bB=y(Math.min(d.o,d.c)),bH=Math.max(1,bB-bT);
      return React.createElement("g",{key:i},
        React.createElement("line",{x1:cx,x2:cx,y1:y(d.hi),y2:y(d.lo),stroke:col,strokeWidth:"1.4"}),
        React.createElement("rect",{x:cx-bodyW/2,y:bT,width:bodyW,height:bH,fill:col}));
    }));
}

// ===== Main App =====
function App(){
  const [loaded,setLoaded]=useState(false);
  const [classes,setClasses]=useState({});
  const [activeId,setActiveId]=useState(null);
  const [settings,setSettings]=useState(DEFAULT_SETTINGS);
  const [market,setMarket]=useState({price:DEFAULT_SETTINGS.eth.start,history:[]});
  const [tab,setTab]=useState("overview");
  const [toasts,setToasts]=useState([]);
  const [modal,setModal]=useState(null);
  const [tradeId,setTradeId]=useState(null);
  const [lastSaved,setLastSaved]=useState(null);
  const [sync,setSync]=useState(HAS_GS?"ok":"err");
  const [kioskMode,setKioskMode]=useState(false);
  const [dbUrl,setDbUrl]=useState("");
  // Form states
  const [fItems,setFItems]=useState([]);
  const [fTarget,setFTarget]=useState("");const [fActual,setFActual]=useState("");
  const [fTutee,setFTutee]=useState("");const [fImp,setFImp]=useState("");
  const [fBorrow,setFBorrow]=useState("");const [fVal,setFVal]=useState("");const [fNote,setFNote]=useState("");
  const [fName,setFName]=useState("");const [fInvest,setFInvest]=useState("");const [fImport,setFImport]=useState("");
  const [fLeaveType,setFLeaveType]=useState("病假");const [fLeaveDate,setFLeaveDate]=useState("");const [fLeaveNote,setFLeaveNote]=useState("");
  const [leaveBusy,setLeaveBusy]=useState(false);
  const [fRepay,setFRepay]=useState("");

  const marketRef=useRef(market);const settingsRef=useRef(settings);
  const lastBlobRef=useRef("");const lastRemoteRef=useRef("");const pendingRef=useRef(false);const tickRef=useRef(0);
  useEffect(()=>{marketRef.current=market;},[market]);
  useEffect(()=>{settingsRef.current=settings;},[settings]);

  const blobOf=(cl,aid,st)=>JSON.stringify({classes:cl,activeId:aid,settings:st});
  const setFromBlob=b=>{
    setClasses(b.classes);
    setActiveId(b.activeId&&b.classes[b.activeId]?b.activeId:Object.keys(b.classes)[0]);
    setSettings({...DEFAULT_SETTINGS,...(b.settings||{})});
  };

  // Load
  useEffect(()=>{(async()=>{
    let blob=null;
    if(HAS_GS){
